(function(){
  const KEY = "adaptive_dashboard_v2_session_v1";
  const START_EQUITY = 100000;
  const START_TIME_SEC = 9*3600;
  function fmtTime(s){ s=((Math.floor(s)%86400)+86400)%86400; const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; const p=n=>String(n).padStart(2,"0"); return p(h)+":"+p(m)+":"+p(sec); }
  function fmtMoney(v){ return (v<0?"-":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2}); }
  // 1) Try to hook into existing app state if it exposes window state
  // 2) Provide a persistent store that survives refresh: we save equity/time/tick/positions/trades/curve from window.__ADAPTIVE_STATE if app sets it
  // 3) If app does NOT expose state, we create our own persistent overlay: we persist DOM values and restore banner
  window.__ADAPTIVE_PERSIST = {
    save: function(state){ try{ state.savedAt=new Date().toISOString(); localStorage.setItem(KEY, JSON.stringify(state)); const el=document.getElementById("lastSavePill"); if(el) el.textContent="saved: "+new Date(state.savedAt).toLocaleTimeString("th-TH"); const b=document.getElementById("persistBadge"); if(b){ b.textContent="localStorage: ON • เล่นต่อได้"; } return true; }catch(e){ return false; } },
    load: function(){ try{ const raw=localStorage.getItem(KEY); if(!raw) return null; const p=JSON.parse(raw); if(!p||typeof p!=="object") return null; return p; }catch(e){ return null; } },
    clear: function(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  };
  // Auto-save hook: if app uses window.__ADAPTIVE_STATE, save it every 2s
  setInterval(function(){
    try{
      const s = window.__ADAPTIVE_STATE || window.state || window.appState;
      if(s && typeof s==="object" && s.equity!==undefined){
        window.__ADAPTIVE_PERSIST.save(s);
      }
    }catch(e){}
  }, 2000);
  window.addEventListener("beforeunload", function(){
    try{
      const s = window.__ADAPTIVE_STATE || window.state;
      if(s) window.__ADAPTIVE_PERSIST.save(s);
    }catch(e){}
  });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState==="hidden"){
      try{
        const s = window.__ADAPTIVE_STATE || window.state;
        if(s) window.__ADAPTIVE_PERSIST.save(s);
      }catch(e){}
    }
  });
  // Show restore banner if previous session exists
  try{
    const prev = window.__ADAPTIVE_PERSIST.load();
    if(prev){
      const div=document.createElement("div");
      div.id="restoreBanner";
      div.style.cssText="position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#22c55e;color:#000;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.4)";
      div.textContent="โหลดเซสชันเดิมแล้ว • เล่นต่อจาก "+fmtTime(prev.timeSec||START_TIME_SEC)+" • Equity "+fmtMoney(prev.equity||START_EQUITY);
      document.body.appendChild(div);
      setTimeout(function(){ div.remove(); }, 5000);
      // Expose restored state for app to pick up on next tick
      window.__ADAPTIVE_RESTORED = prev;
    }
  }catch(e){}
  // Patch Reset buttons: when user confirms reset, also clear localStorage
  document.addEventListener("click", function(e){
    const t=e.target;
    if(t && (t.id==="btnConfirmReset" || (t.textContent||"").includes("ยืนยันรีเซ็ต"))){
      setTimeout(function(){ window.__ADAPTIVE_PERSIST.clear(); }, 100);
    }
  }, true);
  // Expose helpers for the app's own code to use
  window.ADAPTIVE_SAVE = window.__ADAPTIVE_PERSIST.save;
  window.ADAPTIVE_LOAD = window.__ADAPTIVE_PERSIST.load;
  console.log("[Adaptive] Persistence ready, key:", KEY);
})();

<script>

(function(){
const STORAGE_KEY="adaptive_dashboard_v2_session_v1"; const START_EQUITY=100000; const START_TIME_SEC=9*3600;
let state=null, playTimer=null;
const els={sessionTime:document.getElementById("sessionTime"),runPill:document.getElementById("runPill"),startPill:document.getElementById("startPill"),equity:document.getElementById("equity"),pnlPill:document.getElementById("pnlPill"),ddPill:document.getElementById("ddPill"),posBody:document.getElementById("posBody"),logBody:document.getElementById("logBody"),curve:document.getElementById("curve"),tickPill:document.getElementById("tickPill"),lastSavePill:document.getElementById("lastSavePill"),copyBox:document.getElementById("copyBox"),persistBadge:document.getElementById("persistBadge"),toast:document.getElementById("toast"),modal:document.getElementById("confirmModal")};
function fmtTime(s){s=((Math.floor(s)%86400)+86400)%86400;const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;const p=n=>String(n).padStart(2,"0");return `${p(h)}:${p(m)}:${p(sec)}`;}
function fmtMoney(v){return (v<0?"-":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2});}
function fmtPnl(v){return (v>0?"+":v<0?"-":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2});}
function cls(v){return v>0?"pos":v<0?"neg":"";}
function nowISO(){return new Date().toISOString();}
function defaultState(){return {version:1,createdAt:nowISO(),savedAt:nowISO(),startedAt:nowISO(),timeSec:START_TIME_SEC,running:false,tick:0,equity:START_EQUITY,peakEquity:START_EQUITY,positions:[],trades:[],equityCurve:[{t:0,eq:START_EQUITY}]};}
function saveState(){try{state.savedAt=nowISO();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));els.lastSavePill.textContent="saved: "+new Date(state.savedAt).toLocaleTimeString("th-TH");els.persistBadge.textContent="localStorage: ON";return true;}catch(e){els.persistBadge.textContent="localStorage: ERROR";return false;}}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return null;const p=JSON.parse(raw);if(!p||typeof p!=="object")return null;const b=defaultState();const m=Object.assign(b,p);if(!Array.isArray(m.positions))m.positions=[];if(!Array.isArray(m.trades))m.trades=[];if(!Array.isArray(m.equityCurve)||!m.equityCurve.length)m.equityCurve=[{t:0,eq:m.equity}];return m;}catch(e){return null;}}
function clearStorage(){try{localStorage.removeItem(STORAGE_KEY);}catch(e){}}
function pseudoRandom(seed){const x=Math.sin(seed*12.9898+78.233)*43758.5453;return x-Math.floor(x);}
const SYMBOLS=["BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","ADAUSDT"];
function stepSimulation(){state.tick+=1;state.timeSec+=1;const r1=pseudoRandom(state.tick),r2=pseudoRandom(state.tick*7+3),r3=pseudoRandom(state.tick*13+11);if(state.positions.length<4&&r1<0.18){const sym=SYMBOLS[Math.floor(r2*SYMBOLS.length)];const side=r3<0.5?"LONG":"SHORT";const qty=+(0.05+r2*0.45).toFixed(3);const price=+(1000+r1*49000).toFixed(2);state.positions.push({id:"p"+state.tick,symbol:sym,side,qty,entry:price,pnl:0});}let realized=0;state.positions.forEach(p=>{const drift=(pseudoRandom(state.tick+p.qty*100)-0.5)*0.008;p.pnl=+(p.pnl+p.qty*p.entry*drift).toFixed(2);if(Math.abs(p.pnl)>p.entry*p.qty*0.02||pseudoRandom(state.tick*3+p.qty)<0.04){realized+=p.pnl;state.trades.unshift({id:state.trades.length+1,time:fmtTime(state.timeSec),symbol:p.symbol,side:p.side,qty:p.qty,price:p.entry,pnl:p.pnl});p.closed=true;}});state.positions=state.positions.filter(p=>!p.closed);if(realized!==0){state.equity=+(state.equity+realized).toFixed(2);if(state.equity>state.peakEquity)state.peakEquity=state.equity;state.equityCurve.push({t:state.tick,eq:state.equity});}else if(state.tick%3===0){state.equityCurve.push({t:state.tick,eq:state.equity});}if(state.equityCurve.length>500)state.equityCurve.shift();if(state.trades.length>200)state.trades.length=200;}
function render(){els.sessionTime.textContent=fmtTime(state.timeSec);els.startPill.textContent="เริ่ม "+fmtTime(START_TIME_SEC).slice(0,5);els.runPill.textContent=state.running?"running":"paused";els.equity.textContent=fmtMoney(state.equity);const pnl=state.equity-START_EQUITY;els.pnlPill.textContent="P&L "+fmtPnl(pnl);const dd=state.peakEquity>0?((state.peakEquity-state.equity)/state.peakEquity)*100:0;els.ddPill.textContent="DD "+dd.toFixed(1)+"%";els.posBody.innerHTML=state.positions.length?state.positions.map(p=>`<tr><td>${p.symbol}</td><td>${p.side}</td><td>${p.qty}</td><td class="${cls(p.pnl)}">${fmtPnl(p.pnl)}</td></tr>`).join(""):'<tr><td colspan="4">ไม่มีโพซิชัน</td></tr>';els.logBody.innerHTML=state.trades.length?state.trades.map(t=>`<tr><td>${t.id}</td><td>${t.time}</td><td>${t.symbol}</td><td>${t.side}</td><td>${t.qty}</td><td>${t.price}</td><td class="${cls(t.pnl)}">${fmtPnl(t.pnl)}</td></tr>`).join(""):'<tr><td colspan="7">ยังไม่มีเทรด</td></tr>';els.tickPill.textContent="tick: "+state.tick;if(state.savedAt)els.lastSavePill.textContent="saved: "+new Date(state.savedAt).toLocaleTimeString("th-TH");els.copyBox.value=buildSummary();drawCurve();}
function drawCurve(){const cv=els.curve,ctx=cv.getContext("2d"),W=cv.width,H=cv.height,pad=26;ctx.clearRect(0,0,W,H);const data=state.equityCurve;if(data.length<2){ctx.fillStyle="#8fa3ba";ctx.fillText("ยังมีข้อมูลไม่พอ",pad,H/2);return;}let min=Infinity,max=-Infinity;for(const d of data){if(d.eq<min)min=d.eq;if(d.eq>max)max=d.eq;}if(min===max){min-=1;max+=1;}const range=max-min;min-=range*0.08;max+=range*0.08;const x=i=>pad+(i/(data.length-1))*(W-pad*2);const y=v=>H-pad-((v-min)/(max-min))*(H-pad*2);ctx.strokeStyle="#1e2a3a";for(let i=0;i<=3;i++){const yy=pad+(i/3)*(H-pad*2);ctx.beginPath();ctx.moveTo(pad,yy);ctx.lineTo(W-pad,yy);ctx.stroke();}ctx.beginPath();ctx.moveTo(x(0),y(data[0].eq));for(let i=1;i<data.length;i++)ctx.lineTo(x(i),y(data[i].eq));ctx.strokeStyle=state.equity>=START_EQUITY?"#22c55e":"#ef4444";ctx.lineWidth=2;ctx.stroke();}
function buildSummary(){const pnl=state.equity-START_EQUITY;const dd=state.peakEquity>0?((state.peakEquity-state.equity)/state.peakEquity)*100:0;return ["=== Adaptive Dashboard v2 — Session Summary ===","Started: "+state.startedAt,"Saved: "+state.savedAt,"Session time: "+fmtTime(state.timeSec)+" (start 09:00:00)","Tick: "+state.tick,"Running: "+state.running,"","Equity: "+fmtMoney(state.equity),"P&L: "+fmtPnl(pnl),"Peak: "+fmtMoney(state.peakEquity),"Drawdown: "+dd.toFixed(2)+"%","Trades: "+state.trades.length,"Open: "+state.positions.length].join("\n");}
let toastTimer=null;function toast(msg){els.toast.textContent=msg;els.toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>els.toast.classList.remove("show"),2200);}
function startPlay(){if(playTimer)return;state.running=true;playTimer=setInterval(()=>{stepSimulation();render();saveState();},1000);render();saveState();}
function pausePlay(){state.running=false;if(playTimer){clearInterval(playTimer);playTimer=null;}render();saveState();}
function stepOnce(){stepSimulation();render();saveState();}
function doReset(){pausePlay();clearStorage();state=defaultState();saveState();render();els.modal.classList.add("hidden");toast("รีเซ็ตแล้ว — กลับไปเริ่มที่ $100,000 เวลา 09:00");}
async function copySummary(){try{await navigator.clipboard.writeText(buildSummary());toast("คัดลอกภาพรวมเซสชันแล้ว");}catch(e){els.copyBox.select();document.execCommand("copy");toast("คัดลอกภาพรวมเซสชันแล้ว");}}
function init(){const loaded=loadState();if(loaded){state=loaded;render();if(state.running){startPlay();toast("โหลดเซสชันเดิมแล้ว — เล่นต่อจาก "+fmtTime(state.timeSec));}else{toast("โหลดเซสชันเดิมแล้ว — "+fmtTime(state.timeSec));}}else{state=defaultState();saveState();render();}
document.getElementById("btnPlay").addEventListener("click",()=>{startPlay();toast("เล่นต่อ");});
document.getElementById("btnPause").addEventListener("click",()=>{pausePlay();toast("หยุดชั่วคราว");});
document.getElementById("btnStep").addEventListener("click",stepOnce);
document.getElementById("btnReset").addEventListener("click",()=>els.modal.classList.remove("hidden"));
document.getElementById("btnCancelReset").addEventListener("click",()=>els.modal.classList.add("hidden"));
document.getElementById("btnConfirmReset").addEventListener("click",doReset);
document.getElementById("btnCopy").addEventListener("click",copySummary);
window.addEventListener("beforeunload",()=>{try{saveState();}catch(e){}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")try{saveState();}catch(e){}});
setInterval(()=>{try{saveState();}catch(e){}},5000);}
init();
})();

</script>
</body>
</html>
